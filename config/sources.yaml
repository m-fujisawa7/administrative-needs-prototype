    notes: サウンディング型市場調査、全庁更新RSS、入札等新着情報から行政課題、RFI、システム・DX、実証、官民連携の行政ニーズを収集する政令指定都市。公式CMSの候補ページにはarticle#contentとarticle#content2の2テンプレートが混在するため、本文は両selectorを明示して取得する。全庁HTMLは50件・約2日分、公式RSSは255件・約10日分を保持し、HTML50件はすべてRSSにも含まれるため、部局横断SourceにはRSSを使う

