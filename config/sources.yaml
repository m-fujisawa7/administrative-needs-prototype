    notes: 大阪府と府内43市町村、企業、大学、シビックテック等が運営する大阪スマートシティパートナーズフォーラム（OSPF）を、独自公式ドメインへの安全なアクセス制限のため別組織として管理する。公式サイトが配信するWordPress RSSを収集に使用し、個別記事の本文は.entry-contentに入る

  - id: hyogo-prefecture
    name: 兵庫県
    organization_type: prefecture
    prefecture: 兵庫県
    official_domain: web.pref.hyogo.lg.jp
    enabled: true
    notes: デジタル実証、市町DX、行政DX、全庁の委託・役務、公民連携を調査対象とする都道府県。神戸市はcity.kobe.lg.jpの別組織として登録済みで、親子関係は結んでいない。県公式CMSは一覧・個別ページとも本文が#tmp_contentsに入る。委託・役務一覧は案件ごとにtable.datatableを置き、名称リンクと公示日を別のtrに分けているため、現行Collectorでは候補のpublishedAtを取得できない。ひょうごSDGs 公民連携プラットフォームは独自ドメインのため、parent_organization_idで兵庫県に結び付けた別組織として管理する

