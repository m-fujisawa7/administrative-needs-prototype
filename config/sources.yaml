    notes: 全庁の業務委託・賃貸借公告、デジタル戦略課の施策、全庁コンテンツ情報からのRFI取りこぼし防止を収集する対象都道府県。**一覧はどれもol.news-list配下のliだが、liの中でアンカーを包む要素が3種類あり掲載日の取得可否が変わる。**デジタル戦略課の新着はli直下にtimeとaが並ぶため10/10件で掲載日を取得できる。コンテンツ情報はaがspanに包まれspanはセレクタ対象外なのでliまで上がれて195/195件取得できる。**業務委託・賃貸借公告はaがdivに包まれるため取得できない。**list-page-checkerはアンカーのclosestで.sec_01・li・article・section・tr・divを探し、divが対象に含まれるのでdivで止まりtimeを含むliまで上がらず、75件すべてが掲載日不明になった。佐賀県と同じ理由である。**title_selectorにmain h1が必要である。**個別ページのh1は2つあり1つ目が全ページ共通の「災害等に関する緊急情報」なので、未設定だと汎用抽出がそれを実タイトルとして取ってしまう。main h1は確認3ページすべてで実タイトルを返した。**本文セレクタはmainを使う。**#contents-bodyは質問書回答ページで122文字と200文字の下限を割るが、mainは313〜1,968文字で確認3ページとも下限を超える。articleは189文字になるページがあり使えない。[role=main]は存在しない。**RSSは3つの一覧とも確認できなかった。**質問回答は独立ページで、セキュリティクラウドの質問書への回答は本文122文字・添付が回答PDF 1件だけだった。募集本体は次世代校務DXのRFIが本文1,794文字で仕様書・要件一覧・帳票一覧・概算見積様式を持ち、統合原子力防災ネットワーク機器賃貸借が告示・公告・入札説明書・様式・仕様書を持つ

  - id: kumamoto-prefecture
    name: 熊本県
    organization_type: prefecture
    prefecture: 熊本県
    official_domain: pref.kumamoto.jp
    enabled: true
    notes: デジタル戦略推進課の施策と公募、全庁の入札・契約、意見募集、全庁新着RSSからのRFI取りこぼし防止を収集する対象都道府県。**CMSは岡山県・愛媛県と同系統で、課の新着はdiv.section_information_list > ul > li、分野別の一覧はdiv.info_list > ul > liに入る。**liはspan.article_dateとspan.article_title > aの2要素で、article_title内のアンカーは1本だけなので候補汚染は無い。**掲載日はリンクと同じliのspan.article_dateに「2026年6月8日更新」形式で入り、3つの一覧すべてで全件解析できる。**意味は更新日である。**デジタル戦略推進課のページはdiv.section_information_listへスコープする。**同じページの後段にdiv.info_listが6つあり、span.article_titleはページ全体で100件になるため、新着情報ブロックに限定しないとカテゴリ欄の再掲まで候補になる。**本文セレクタは#mainを使う。**#main_bodyは394〜2,058文字、#mainは#main_aと同じ範囲で34〜47文字多いだけである。main・article・[role=main]・#contentsはいずれも存在せず、岡山県・愛媛県と同じ選択に揃えている。h1は1つで実タイトルなのでtitle_selectorは不要である。**課別RSSは登録しない。**デジタル戦略推進課のsoshiki-3-26.xmlはRSS 1.0でdc:dateとcategoryを持つがcategoryは所属課名1種だけで、確認時点でitem 33件のうち30件がHTMLと一致し独自3件は2021年から2022年の期間外の記事だった。全庁新着RSSだけはRFI取りこぼし防止として別途登録する

  - id: oita-prefecture
    name: 大分県
    organization_type: prefecture
    prefecture: 大分県
    official_domain: pref.oita.jp
    enabled: true
    notes: デジタル政策課の施策と公募、全庁の企画提案（プロポーザル等）、パブリックコメントの募集中一覧を収集する対象都道府県。**CMSは岡山県・愛媛県・福岡県・熊本県と同系統で、課の新着はdiv.section_information_list > ul > li、分野別の一覧はdiv.info_list.info_list_date > ul > liに入る。**liはspan.article_dateとspan.article_title > aの2要素で、article_title内のアンカーは1本だけなので候補汚染は無い。**掲載日はリンクと同じliのspan.article_dateに「2026年8月10日更新」形式で入り、3つの一覧すべてで全件解析できる。**意味は更新日で、一覧は日付の降順である。**課ページには日付を持たないdiv.kanren_list（目的別分類）も並ぶので、link_selectorはdiv.info_listとdiv.section_information_listだけを指す。**kanren_listを含めると掲載日不明候補が期間フィルタを通ってしまう。**本文セレクタは3Sourceとも#mainを使う。**#main_bodyは確認8ページで302〜2,832文字、質問への回答ページが302文字で200文字の下限へ近づく。#mainは#main_aと同じ範囲で17〜67文字多く351〜2,899文字だった。main・article・[role=main]・#contentsはいずれも存在しないため、content_selectorを省略するとfallbackが#mainまで進んでWarningになる。h1は確認8ページすべて1つで実タイトルなのでtitle_selectorは不要である。**個別ページの掲載日はページ本文の「更新日」から取得でき、一覧の日付と一致した。**添付は公告・入札説明書・募集要項・審査基準・回答がPDFである

  - id: miyazaki-prefecture
    name: 宮崎県
    organization_type: prefecture
    prefecture: 宮崎県
    official_domain: pref.miyazaki.lg.jp
    enabled: true
    notes: デジタル推進課の新着、全庁の委託業務と入札情報一覧、生活・協働・男女参画課の協働案件を収集する対象都道府県。**CMSはこれまでの県と別系統で、IDがtmp_で始まる。一覧は2種類ある。**課の新着はdiv#tmp_contents > ul > liで、日付はアンカーテキストの末尾に「（8月21日）」と年なしで入る。委託業務・入札情報一覧・その他はtable.list_table > tbody > trで、td.dateとtd > p > aが同じtrに並ぶ。**後者はアンカーのclosestがp・tdを対象外として通過しtrへ届くので、「2026年8月21日」を全件解析できる。**別調査は3つの表形式一覧をB型・取得不可と判定していたが、実測では入札情報一覧200件、委託業務481件、その他6件すべてでpublishedAtを取得できた。佐賀県・長崎県のようにdivでclosestが止まる構造ではない。**課の新着は逆に年が無いためpublishedAtを取得できず、全件が掲載日不明として期間フィルタを通る。**本文セレクタは4Sourceとも#tmp_contentsを使う。**確認6ページで972〜3,227文字だった。.col_mainは243〜255文字多いだけだが、#tmp_mainはナビを含んで2,204〜24,433文字に膨らみ、main・article・[role=main]・#contentsは存在しない。**content_selectorを省略するとfallbackがbodyまで進み、RFIページで22,614文字、企画提案競技ページで24,850文字になるため必ず設定する。**h1は確認6ページすべて1つで実タイトルなのでtitle_selectorは不要である。添付は/documents/配下のPDFで、募集要項・仕様書・機能要件一覧・様式が4〜12件付く。**一覧のリンクテキストと個別ページの内容が食い違う実例がある。**/digital-suishin/kense/chotatsu/20260817150012.htmlは新着と委託業務の両方で「宮崎県電子申請システムに係る情報提供依頼（RFI）の実施について」と表示されるが、実ページのh1と本文は「宮崎県クラウドサービス型生成AIサービスの共同調達・共同利用に関する情報提供依頼(RFI)」で更新日は2026年8月21日、電子申請の語は本文に無い。リダイレクトは無く、同じURLの内容が差し替えられている。登録内容は個別ページ側になるが、同一URLへ次の案件が載るとduplicate-firstで検知できない。**入札情報一覧のRSSは登録しない。**/shinchaku/nyusatsu/nyusatsu.xmlはRSS 1.0で全件にdc:dateがあるが、確認時点のitemは10件・2026年8月20日から21日の2日分しか保持せず、HTMLの200件・72日分より大幅に狭い。categoryも県政情報と入札・調達・売却の2種固定で絞り込みに使えない

  - id: kagoshima-prefecture
    name: 鹿児島県
    organization_type: prefecture
    prefecture: 鹿児島県
    official_domain: pref.kagoshima.jp
    enabled: true
    notes: 県政情報・事業者向け・社会基盤の短期新着と、長期保持される入札情報から行政ニーズを収集する対象都道府県。宮崎県などと同じ#tmp_接頭辞のCMSで、一覧・個別ページとも本文は#tmp_contentsに入る。3つの新着一覧はtable.list_table > tbody > trで、表示される日付は「8月21日」のように年を含まないため、候補のpublishedAtは取得できず期間フィルタが効かない。入札情報の入口にも案件日付が無い。公式の全庁最新RSSはRSS 1.0で取得できるが、item 10件・約5日分しか保持しない

  - id: okinawa-prefecture
    name: 沖縄県
    organization_type: prefecture
    prefecture: 沖縄県
    official_domain: pref.okinawa.jp
    enabled: true
    notes: 年度別の公募・入札発注情報3区分と全庁新着更新情報を収集する対象都道府県。**公式サイトはwww.pref.okinawa.jpとwww.pref.okinawa.lg.jpの2ドメインが並行して生きている。**同じパスがどちらも200で返りリダイレクトも無い。official_domainは候補URLと一覧内リンクの解決先に合わせてpref.okinawa.jpとする。一覧のアンカーは相対URLなので候補は常にpref.okinawa.jp側へ解決され、Source間で表現は揺れない。**全庁新着のRSSは登録できない。**/news.rssはRSS 2.0でpubDateを持つが、itemのlinkがwww.pref.okinawa.lg.jpの絶対URLなので、現行の公式ドメイン判定では全itemが外部ドメイン扱いになり「タイトルと公式ドメイン内URLを持つitemがありません。」で解析が止まる。仮にofficial_domainを.lg.jp側にすると3つの年度別一覧が全滅するので、HTMLの新着更新情報を使う。RSSを使う場合は同一案件が2ドメインで別URLになりURL単位duplicateが効かなくなる点も残る。**一覧は2種類の構造がある。**年度別の発注情報はtable > tbody > trで、案件名のtdと募集期間または開札日のtd、担当課のtdが並ぶ。全庁新着はul.newslist > li.boxで、span.dateとspan.newsli > aが同じliに入る。**本文セレクタは4Sourceともmainを使う。**確認5ページでmain・article#content・[role=main]・#voice・#contentがすべて同じ本文を返し714〜1,605文字だった。#pagebodyだけ10文字多い。content_selectorを省略してもfallbackがmainで止まるので実害は小さいが、毎回fallback警告が出るためmainを明示する。h1は確認5ページすべて1つで実タイトルなのでtitle_selectorは不要である。個別ページには「ページ番号1041079 更新日 2026年8月19日」と更新履歴が入り、募集終了案件には「この案件は募集を終了しています。」が本文に出る。添付は実施要領・仕様書・質問回答書のPDFが0〜6件付く。**年度別一覧は毎年度URLが変わる。**親ページは年度リンクだけを並べる索引で案件一覧を持たないため、Sourceには年度ページを登録し、年度替わりに新年度URLへ差し替える運用にする。索引は情報関連が/shigoto/nyusatsukeiyaku/1015342/1025066/index.html、コンサルが同1025074、産業支援が同1025075で、公募・入札発注情報のトップは/shigoto/nyusatsukeiyaku/1015342/index.htmlである。**未登録の区分がある。**賃貸借・リース（1025069）、広報・広告・イベント（1025064）、調査・検査・収集・運送（1025068）、調達（1025082）にもICT案件が入るため、全庁新着で拾えなかった場合の追加候補として残す

  - id: ibaraki-prefecture
    name: 茨城県
    organization_type: prefecture
    prefecture: 茨城県
    official_domain: pref.ibaraki.jp
    enabled: true
    notes: 教育委員会の入札公告、情報システム課と計画推進課の新着を収集する対象都道府県。**サイトが2系統ある。**本体はwww.pref.ibaraki.jpのCMSでIDがtmp_で始まり、教育委員会はkyoiku.pref.ibaraki.jpのWordPressである。official_domainをpref.ibaraki.jpにすることでサブドメイン判定が両方を許可するため、組織は分割しない。**本体の一覧は2形式ある。**課の新着はdiv#tmp_contents > div.section > ul > liで、日付がアンカー直前のテキストノードとして「2026年8月24日」形式で入る。全庁新着はul.idx_news_list > liでspan.dateとaが並ぶ。どちらもアンカーのclosestがliへ届くため全件解析でき、意味はCMSの新着・更新日である。**教育委員会の一覧はul.linkcard > li > aで、アンカーテキスト内に「公告日：令和8年8月10日」が入る。**同じul.linkcardに発注見通しのPDF直リンク2本が入るので、link_selectorは案件記事のURLパターンで絞る。**本文セレクタは本体が#tmp_contents、教育委員会がmainである。**本体はmain・article・[role=main]・#contentsが無く、#tmp_contentsで844〜4,032文字を取得できたが、選定結果のような薄いページでは200文字の下限を割ってbodyへfallbackする。教育委員会はmainと[role=main]が同じ本文を返し、確認3ページで144〜547文字だった。**教育委員会の薄い案件ページは本文抽出エラーになる。**県立神栖特別支援学校厨房機器調達は本文144文字で、bodyへfallbackしてもナビ除去後に200文字へ届かず、content抽出が失敗する。本体はPDFの公告・仕様書にあるがHTML本文が下限未満のため現行処理では渡せない。**h1は本体が実タイトル、教育委員会はロゴ画像だけで空である。**教育委員会はtitleに「案件名 – 茨城県教育委員会」が入り、main h3が案件名だけを返すのでtitle_selectorにmain h3を設定する。確認3ページすべてh3は1つだった。**全庁新着のRSSは登録しない。**/news.xmlはRSS 1.0でitem 20件・2026年7月24日から8月24日の1か月分に対し、HTMLは39件・4か月分でHTMLの方が広い。categoryは13種類あるが県政情報やしごと・産業のような分野名で、ICT案件を絞る用途には使えない

