    prefecture: 京都府
    official_domain: pref.kyoto.jp
    enabled: true
    notes: デジタル政策、全庁の入札・プロポーザル、事業者向け新着、公民連携の行政ニーズを収集する対象都道府県。京都市はcity.kyoto.lg.jpの別組織として登録済みで、親子関係は結んでいない。府公式CMSは一覧・個別ページとも本文が#tmp_contentsに入り、一覧の日付は年を省いた月日表記、RSSはRSS 1.0（RDF）でdc:dateとdc:subjectを持つ

  - id: mie-prefecture
    name: 三重県
    organization_type: prefecture
    prefecture: 三重県
    official_domain: pref.mie.lg.jp
    enabled: true
    notes: 情報提供依頼（RFI）と意見招請（RFC）、全庁の企画提案コンペ、デジタル推進局の更新情報を収集する対象都道府県。**本文は#center-contentsに入る。**#wrapper、#container、#container-inner、.center-contents-wlsは外側の入れ物である。フォールバック候補の#main、#contents、#content、.contentに該当する要素が無いため、content_selectorを省略するとbody全体が本文になりWARNINGが出るので全情報源で明示する。**一覧はどのページも共通で.news-box配下のtable.cell-aで、trごとにtd.date-aへ日付、td.news-aへ表題とリンク、td.from-aへ所属名とリンクが入る。**岐阜県・愛知県と同じくtd.from-aにも所属別リンクがあるため、link_selectorをtd.news-aまで絞らないと候補が倍になる（デジタル推進局の更新情報では生200件が400件になり重複除去で198件が落ちる）。**掲載日はゼロ埋めの和暦「令和08年08月18日」形式で、parseDateCandidateがそのまま2026-08-18として解釈できることを確認した。**個別ページの本文冒頭にはSNS共有ラベルが約30文字入るが実害はない。確認した4ページにRSSの配信は無く、取得手段はHTMLだけである。**継続巡回性は良好である。**個別案件URLは/NYUSATSU/m0030700309.htmや/KYOSYOK/HP/000247105_00024.htmのように記事ごとの固有連番で発行され、同じシリーズでも回次ごとに番号が増える（学校情報ネットワークの2件は_00023と_00024、地理情報システムの2件はm0364300074とm0364300075）。**年度や回次で固定URLを上書き再利用する形ではないため、URL単位のduplicate判定と相性が良い。**一方で4ページともページャが無く、一覧は固定件数のウィンドウ表示なので、保持件数の少ない一覧は巡回間隔を空けると取り逃す

  - id: nara-prefecture
    name: 奈良県
    organization_type: prefecture
    prefecture: 奈良県
    official_domain: pref.nara.lg.jp
    enabled: true
    notes: 情報システム調達、デジタル戦略課の担当ページ、行政・施策の入札を収集する対象都道府県。**山梨県・長野県・石川県・宮城県・富山県と同じ#tmp_接頭辞のCMSで、本文は#tmp_contentsに入る。**#tmp_wrapper、#tmp_main、.wrap_col_main、.col_main、#tmp_read_contentsは外側の入れ物である。**一覧の形式がページごとに3種類あり、掲載日の持ち方も異なる。**情報システム入札情報はli内に「令和8年3月5日掲載：」の和暦プレフィックスを置き、デジタル戦略課の担当ページ一覧はli内のp.dateに「2026年8月17日」の西暦を置き、行政・施策に関する入札等はdiv.idx3_list配下のli直下にaがあるだけで掲載日を持たない。和暦・西暦ともparseDateCandidateが行テキストから解釈できることを確認した。確認した5ページにRSSの配信は無く、取得手段はHTMLだけである。**個別案件URLは/n026/p155023.htmlや/n003/p149036.htmlのように所属コードと連番で発行され、年度や回次で固定URLを上書き再利用する形ではない。**ページャはどの一覧にも無く固定件数のウィンドウ表示である

  - id: wakayama-prefecture
    name: 和歌山県
    organization_type: prefecture
    prefecture: 和歌山県
    official_domain: pref.wakayama.lg.jp
    enabled: true
    notes: デジタル実証、官民共創、行政DX、全庁の入札・プロポーザルを調査対象とする都道府県。県公式CMSは一覧・個別ページとも本文が#contentに入り、その直下にh1とdiv.articleまたは日付付き一覧が置かれる。行政企画課の新着はdiv.list.list-dateのliに掲載日と個別ページへのリンクを持つ。入札・物品・役務はHTMLとRSS 2.0を同数保持するが、一部の案件URLを年度別の別調達へ再利用するため、現行のURL単位duplicateとは相性が悪い

  - id: osaka-prefecture
    name: 大阪府
    organization_type: prefecture
    prefecture: 大阪府
    official_domain: pref.osaka.lg.jp
    enabled: true
    notes: スマートシティ、公民連携、行政DX、共同調達、全庁の公募型プロポーザルを調査対象とする都道府県。大阪市はcity.osaka.lg.jpの別組織として登録済みで、親子関係は結んでいない。府公式CMSは一覧・個別ページとも本文が#tmp_contentsに入る。全庁プロポーザルはliの行テキストに和暦の公募開始日と終了日を持ち、parseDateCandidateが先頭の開始日を掲載日として解釈する。大阪スマートシティパートナーズフォーラムは独自ドメインのため、parent_organization_idで大阪府に結び付けた別組織として管理する

