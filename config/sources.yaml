  - id: kawasaki-city
    name: 川崎市
    organization_type: designated_city
    prefecture: 神奈川県
    official_domain: city.kawasaki.jp
    enabled: true
    notes: 全庁のプロポーザル、サウンディング型市場調査、デジタル化施策の行政ニーズを収集する対象自治体。個別ページの本文コンテナはIDのmol_contentsとクラスのmol_contentsが混在するため、content_selectorはクラスセレクターの.mol_contentsで両方に当てている

  - id: kawasaki-city-colab
    name: 川崎市
    organization_type: external_organization
    official_domain: kawasakicity100.jp
    enabled: true
    parent_organization_id: kawasaki-city
    notes: 川崎市の官民連携窓口Kawasaki Future Co-Labを、独自公式ドメインへの安全なアクセス制限のため別組織として管理。記事から見つけた添付PDFに限り、parent_organization_idで参照する川崎市のcity.kawasaki.jp配下も取得を許可する

  - id: hokkaido-prefecture
    name: 北海道
    organization_type: prefecture
    prefecture: 北海道
    official_domain: pref.hokkaido.lg.jp
    enabled: true
    notes: 全庁のプロポーザルと公募、AI・DX推進局DX推進課の施策、イノベーション推進局情報政策課の情報システム調達の行政ニーズを収集する対象都道府県。一覧ページと個別ページは同一CMSで、一覧はdiv.pages配下のarticleが1件で、その中のheader > h2 > aが案件リンク、個別ページの本文はarticle.bodyに入るため、link_selectorとcontent_selectorは4情報源で共通になる。地域課題の応募フォームは共同利用基盤のharp.lg.jpとharp.asp.lgwan.jpにあり公式ドメイン外のため取得できない。札幌市はcity.sapporo.jpの別組織として登録済みで、この組織とは親子関係を持たせていない

  - id: fukuoka-city
    name: 福岡市
    organization_type: designated_city
    prefecture: 福岡県
    official_domain: city.fukuoka.lg.jp
    enabled: true
    notes: 全庁の提案競技・公募、DX戦略、PPP/PFI事業の行政ニーズを収集する対象自治体。実証実験フルサポート事業mirai@のmirai.city.fukuoka.lg.jpはcity.fukuoka.lg.jpのサブドメインのため、別組織に分けず同一組織として管理する。本体CMSは個別ページの本文が.wb-contentsに入る。#maincontentsはスキップリンクの着地点で中身が空なので、IDに引かれてcontent_selectorへ指定しないこと。北九州市はcity.kitakyushu.lg.jpの別組織として登録済みで、この組織とは親子関係を持たせていない

  - id: fukuoka-city-100lab
    name: 福岡市
    organization_type: external_organization
    official_domain: f-100lab.jp
    enabled: true
    parent_organization_id: fukuoka-city
    notes: 福岡市の共創プラットフォーム福岡100ラボを、独自公式ドメインへの安全なアクセス制限のため別組織として管理。記事から見つけた添付PDFに限り、parent_organization_idで参照する福岡市のcity.fukuoka.lg.jp配下も取得を許可する

  - id: niigata-prefecture
    name: 新潟県
    organization_type: prefecture
    prefecture: 新潟県
    official_domain: pref.niigata.lg.jp
    enabled: true
    notes: 情報システム調達、全庁の入札・発注、創業・イノベーション施策、公民連携の行政ニーズを収集する対象都道府県。福島県と同じCMSベンダーで、所属別・分類別のRSSを配信しており、いずれもRSS 1.0（RDF）でルートがrdf:RDF、公開日がdc:date、カテゴリがdc:subjectである。各HTMLページの新着情報は5件から15件しか載せないが、同じ内容のRSSが40件から50件を保持するため、収集はRSSを採用する。個別ページの本文は#main_bodyに入る。#main、#main_a、#mymainbackはページ番号や印刷リンクを含む外側の入れ物なので使わない

  - id: toyama-prefecture
    name: 富山県
    organization_type: prefecture
    prefecture: 富山県
    official_domain: pref.toyama.jp
    enabled: true
    notes: 全庁の公募型プロポーザル、民間提案制度、デジタル戦略の行政ニーズを収集する対象都道府県。石川県や宮城県と同じ#tmp_接頭辞のCMSで、本文は#tmp_contentsに入る。#tmp_mainはパンくずと関連リンクを含む外側の入れ物なので使わない。掲載日はtime要素ではなくタイトル先頭の【令和8年8月12日公告】形式の和暦で、parseDateCandidateが解釈する。配信しているRSSは/emergency.xmlの緊急情報だけで、新潟県や福島県のような所属別RSSは無い。noteのtoyama-pref.note.jpに記事があるが共用ブログ基盤のためofficial_domainに含めない

  - id: hiroshima-city
    name: 広島市
    organization_type: designated_city
    prefecture: 広島県
    official_domain: city.hiroshima.lg.jp
    enabled: true
    notes: 全庁のプロポーザル・コンペ案件、全庁新着、DX推進計画の行政ニーズを収集する対象自治体。一覧・個別ページとも本文はarticle#content配下のdiv#voiceに入るため、content_selectorは#contentで足りる。#pagebodyはローカルナビと関連リンクを含む外側の入れ物なので使わない。全庁新着はRSS 2.0で配信されるがcategory要素を持たない

  - id: nagano-prefecture
    name: 長野県
    organization_type: prefecture
    prefecture: 長野県
    official_domain: pref.nagano.lg.jp
    enabled: true
    notes: 全庁の公募型プロポーザル公告、DX推進課の公募、官民連携の行政ニーズを収集する対象都道府県。石川県・宮城県・富山県と同じ#tmp_接頭辞のCMSで、本文は#tmp_contentsに入る。確認した4ページにlink[type=rss]も配信一覧も無く、取得手段はHTMLだけである。掲載日はtime要素を持たず、一覧では表の掲示日セル、個別ページでは本文の和暦をparseDateCandidateが解釈する。チャレンジナガノ2.0はchallenge-nagano.pref.nagano.lg.jpのサブドメインなのでofficial_domain配下として取得できるが、各募集テーマの詳細はchallengenagano.notion.siteにある。Notionの公開サイトを許可するとSSRFの許可ドメインを第三者SaaSへ広げることになるためofficial_domainには含めない

  - id: fukui-prefecture
    name: 福井県
    organization_type: prefecture
    prefecture: 福井県
    official_domain: pref.fukui.lg.jp
    enabled: true
    notes: DX推進課の情報システム調達、全庁の入札案件、官民共創の行政ニーズを収集する対象都道府県。本文はdiv.section配下の#contentに入る。#contentにはSNS共有のdocument.writeが含まれるが、content-checkがEXCLUDED_ELEMENTSでscriptを除去するため実本文だけが残る（調達案件ページでは1602文字が713文字になる）。掲載日はtime要素を持たず、一覧ではspan.dateの「(最終更新日 2026年8月17日)」形式かli内の「[2026年8月17日]」形式で、いずれもparseDateCandidateが行テキストから解釈する。RSSはnews.xmlがRSS 1.0（RDF）で配信されるがitem 6件・約1週間分しか保持せずcategory要素も無い。同じ内容のHTML新着一覧news.htmlは2430件を保持するので、全庁新着を使う場合はHTML側を採る
  - id: gifu-prefecture
    name: 岐阜県
    organization_type: prefecture
    prefecture: 岐阜県
    official_domain: pref.gifu.lg.jp
    enabled: true
    notes: 公募型プロポーザル、デジタル戦略推進課と産業イノベーション推進課の新着の行政ニーズを収集する対象都道府県。新潟県・福島県と同じnetcrew系CMSで、個別ページの本文は#main_bodyに入る。#main、#main_a、#mymainbackは外側の入れ物なので本文には使わない。一覧の項目はli内のspan.article_dateに「2026年8月4日更新」、span.article_sectionに所属、span.article_titleにタイトルとリンクが入る。span.article_sectionにも所属別検索へのリンクがあるため、link_selectorはspan.article_titleまで絞らないと候補が倍になる。課のトップページでは新着情報が#main_body内ではなくdiv.section_information（#main_a配下）にあり、#main_body側は固定ページのハブリンクなので、新着を取るには.section_informationを使う。RSSはRSS 1.0（RDF）を2本配信し、いずれも100件・dc:date全件・dc:subjectに所属名を持つ

  - id: yamanashi-prefecture
    name: 山梨県
    organization_type: prefecture
    prefecture: 山梨県
    official_domain: pref.yamanashi.jp
    enabled: true
    notes: 全庁の入札・公売公告、DX課の情報システム調達、官民連携の行政ニーズを収集する対象都道府県。長野県・石川県・宮城県・富山県と同じ#tmp_接頭辞のCMSで、一覧ページと個別ページのどちらも本文は#tmp_contentsに入る。確認した4ページにlink[type=rss]もxmlフィードへのリンクも無く、取得手段はHTMLだけである。**掲載日の扱いが一覧と個別ページで異なる。**公告一覧のliには日付のマークアップが無く、DX課の新着は「7月14日」のように年を含まないためparseDateCandidateがnullを返す。一方で個別ページには「公示日 2026年08月17日」の欄があり、こちらはparseDateCandidateが解釈できる。候補の期間フィルタは一覧側の掲載日で判定するため、山梨県の候補は掲載日不明として全件が対象になりinitial_sinceは効かない

  - id: shizuoka-prefecture
    name: 静岡県
    organization_type: prefecture
    prefecture: 静岡県
    official_domain: pref.shizuoka.jp
    enabled: true
    notes: 企画部の入札・業務委託・プロポーザル、デジタル戦略課の政策シグナル、官民連携の行政ニーズを収集する対象都道府県。CMSは他県と別系統で、**本文は#content（内側にdiv#voice）に入るが、新着更新情報のページだけは#content2と.newslistを使う**ため、newslist.htmlへ#content系のセレクタを当てると0件になる。個別の案件ページでは#contentとmainが同じ範囲を指すので、content_selectorを省略してもmainへフォールバックして同じ本文が取れる。**掲載日は個別ページの「更新日 2026年5月27日」から取れるが、入札一覧のliには日付が無い。**RSSはRSS 2.0を1本配信し、確認時点で114件・pubDate全件・**category要素なし**だった。添付資料にWordを使う案件があり（統合宛名システムの実施要領はWord 23.8KB）、PDF以外は取得対象外である

  - id: shizuoka-prefecture-colab
    name: 静岡県
    organization_type: external_organization
    parent_organization_id: shizuoka-prefecture
    official_domain: shizuoka.eiicon.net
    enabled: true
    notes: 静岡県実証実験サポート事業CO-LAB Shizuokaが第三者SaaSのeiicon（AUBA）上のテナントサブドメインで公開されているため、config/README.mdの方針に従い静岡県を親組織とする別組織として登録する。**official_domainにはeiicon.netではなくテナントのshizuoka.eiicon.netを指定している。**isHostnameAllowedは完全一致とドット付きサフィックス一致だけを許すため、この指定では他テナント（別組織のeiicon.net配下）へはアクセスできない。名古屋市Hatch、川崎市Co-Lab、福岡市100ラボ、北九州市Q-PORTと同じ方式である

  - id: aichi-prefecture
    name: 愛知県
    organization_type: prefecture
    prefecture: 愛知県
    official_domain: pref.aichi.jp
    enabled: true
    notes: 全庁プロポーザル、デジタル戦略課、スタートアップ活用まちづくり支援の行政ニーズを収集する対象都道府県。**岐阜県・新潟県・福島県と同じnetcrew系CMSで、個別ページの本文は#main_bodyに入る。**#main、#main_a、#mymainbackは外側の入れ物なので本文には使わない。一覧の項目はli内のspan.article_dateに「2026年8月13日更新」、span.article_titleにタイトルとリンク、span.article_sectionに所属名とリンクが入るため、link_selectorをspan.article_titleまで絞らないと所属名リンクの分だけ候補が増える（全庁プロポーザルの実測で生70件が38件になる）。課のトップページでは新着がdiv.section_informationにあり、#main_body側は掲載日を持たない固定ページのハブリンクである。**AICHI X TECHはaichixtech.pref.aichi.jpというpref.aichi.jp配下のサブドメインなので、official_domainだけで到達でき外郭組織を作る必要がない。**名古屋市は政令指定都市として独立した組織で登録済みのため親子関係は結んでいない。RSSはRSS 1.0（RDF）を全庁と所属別に配信する

sources:
  - id: osaka-digital-rss
    organization_id: osaka-city
    name: デジタル統括室 RSS
    url: https://www.city.osaka.lg.jp/ictsenryakushitsu/rss/rss.xml
    collector_type: rss
    source_category: digital_news
    priority: high
    enabled: true
    content_selector: "#mol_contents"
    category_includes:
      - 入札契約情報
      - DX・デジタル化・スマートシティ
      - 主要な計画、指針・施策
    title_excludes:
      - 入札結果
      - 随意契約結果
      - 選定結果
      - 再委託状況
      - 要綱・要領等
    document_type_hints:
      - RFI
      - 情報提供依頼
      - 計画
    notes: デジタル統括室が公開する新着情報。RSSカテゴリで対象候補を絞る。
    last_verified_at: "2026-08-05"
    verification_status: verified

  - id: osaka-proposal-list
    organization_id: osaka-city
    name: プロポーザル方式等発注案件
    url: https://www.city.osaka.lg.jp/templates/proposal_hattyuuannkenn/0-Curr.html
    collector_type: list_page
    source_category: procurement
    priority: high
    enabled: true
    link_selector: "#koji_wrap .sec_01 h2 a[href*='/templates/proposal_hattyuuannkenn/']"
    content_selector: "#mol_contents"
    document_type_hints:
      - プロポーザル
      - 企画提案募集
    notes: 大阪市全体のプロポーザル方式等発注案件。一覧には対象外案件も含まれる。
    last_verified_at: "2026-08-05"
    verification_status: verified

  - id: osaka-digital-press
