    notes: 全庁の入札・調達・売却を横断する新着一覧で、**デジタル推進課以外の部局から出る早期ニーズを取りこぼさないためのセンサーとして登録する。**確認時点は200件で200件すべて掲載日を取得でき、重複や外部ドメインは0件だった。ページャは無い。**保持が2026年6月10日から8月21日の72日分しかなく、1日あたり約2.8件で回転が速い。**巡回が2か月以上空くと取りこぼすため、委託業務一覧（11年分保持）と併用する前提にする。**title_includesで28語に絞る。**200件のうち26件が一致し、期間内167件のうち25件が残る。既定--limit 5では5回に分かれる。**部局横断で拾えた実例が価値を示している。**畜産試験場の県有種雄牛活用・交配シミレーションシステム構築に関するRFI、高校教育課の産業イノベーション人材育成に資する施設整備サウンディング型市場調査、次世代校務支援システム共同調達・構築支援、家屋評価システム導入、福祉保健業務相談対応支援システム、県立学校教育用ソフトウェアライセンス、産業技術専門校の校内情報ネットワーク設備、スマートフォン端末賃貸借がいずれもデジタル推進課の新着には現れない。**落ちている142件はフルカラー複合機の複写サービスが最多で、コピー用紙、A重油、フォークリフト、テーブル、冷凍庫修繕、警備、印字・封入封緘、広報・イベント委託が続き、自社領域の案件は無い。**企画提案とプロポーザルは除外語にも含有語にも入れない。**この一覧は広報誌制作や研修運営の企画提案競技が大量に流れるため、語として入れると絞り込みが崩れる。**委託業務一覧との重複は大きい。**200件のうち70件が委託業務にも載るが、URL単位duplicateで2回目以降はスキップされる。**title_excludesは初回Write結果を見て入札結果と結果の公表の2語を追加した。**対面式セミセルフレジシステムの賃貸借及び保守等に関する業務委託の入札結果と、（令和8年度）DXけん引人材育成事業に係る業務委託企画提案競技の結果の公表が候補に入ったためである。いずれも募集でもRFIでもサウンディングでもない結果ページで、後者は#tmp_contentsの本文が152文字しかなく200文字の下限を割ってbodyへfallbackし約19,081文字をAIへ渡していた。**通常の案件はパソコン賃貸借約3,700文字、RFI 1,533文字、サウンディング2,479文字と正常に取得できているため、selectorの問題ではなく結果ページ固有の構造として扱い、content_selectorは変更しない。****実測では2語が一覧200件のうち17件に一致し、includes一致は26件から20件、期間内は25件から19件になる。**想定していた23件より2語の効きが広く、内訳は入札結果1件と結果の公表5件である。結果の公表は「企画提案競技の結果の公表」だけでなく「企画提案競技結果の公表」の形にも一致するため、みやざきデジタル人材育成事業2件、みやざきDX推進モデル企業創出事業、外国人材受入・定着支援センターのホームページ等運用保守も落ちる。6件すべてが結果または公表のページで、募集本体・RFI・サウンディング・入札公告の誤除外は0件だった。**残る19件にはパソコン賃貸借2件、県有種雄牛活用・交配シミレーションシステム構築のRFI、施設整備サウンディング型市場調査、次世代校務支援システム共同調達・構築支援、スマートフォン端末賃貸借、校内情報ネットワーク設備、レジシステムの入札公告が残る。****初回Write19件を最後まで確認した結果、審査結果・結果について・結果公表の3語を追加した。**通過していた6件は家屋評価システム導入の審査結果、統合型校務支援システムの環境構築の結果、庁内DX推進サポートヘルプデスクの結果、生成AIチャットボットの結果、RPA等ライセンスの結果公表、高画質デジタルマイクロスコープの結果公表で、すべて終了段階であり募集・RFI・サウンディング・入札公告として残すべきものは無かった。3語で新たに落ちるのはこの6件だけで、期間内は19件から13件になる。一覧200件に対する5語の一致は85件、利用可能は14件になった。**結果のような広い語へは広げない。**結果だけにすると審査結果を含まない結果報告や調査結果の共有まで落ちる余地が出るため、実測した5語に限定する。**結果ページは本文が極端に短い。**#tmp_contentsで132文字、182文字、191文字、152文字、178文字の例があり、200文字の下限を割ってbodyへfallbackすると約19,000文字をAIへ渡してしまう。通常案件はパソコン賃貸借約3,700文字、RFI 1,533文字、サウンディング2,479文字を取得できているため、selectorではなく候補段階の除外で対応する。**内容トピックによる除外は入れない。**県立3病院医療機器等共同調達は自社領域から遠いが単発1件なので、医療機器・機器・調達・ライセンスのような語をSource filterへ反映しない
