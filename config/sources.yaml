    notes: 兵庫県の公式ページから案内される「ひょうごSDGs 公民連携プラットフォーム」を、独自公式ドメインへの安全なアクセス制限のため別組織として管理する。連携先募集はWordPressの公開RSSを配信し、個別ページの本文は.page_content2に入る

  - id: tottori-prefecture
    name: 鳥取県
    organization_type: prefecture
    prefecture: 鳥取県
    official_domain: pref.tottori.lg.jp
    enabled: true
    notes: 全庁の入札公告、デジタル改革課とデジタル基盤整備課の更新情報を収集する対象都道府県。公式サイトの名称は「とりネット」で、ASP.NET系のCMSのため本文は#ContentPane、一覧はdiv.BrowserPickUP_torinet_notitle_dateやdiv.BrowserItemList_torinet_contentに入る。**この自治体はHTMLではなくRSSを採る。**3ページがRSS 1.0（RDF）を配信しており、**HTML側は掲載日をほとんど取得できないのに対しRSSはdc:dateを全件に持つ。**入札情報のHTMLは日付のdiv.SubBoxとリンクのdiv.Titleが兄弟としてフラットに並ぶため行テキストから日付を関連付けられず、実測で50件中8件しか掲載日が取れず、しかもその一部は「鳥取県からのお知らせ（2026年8月13日）」のようなタイトル内の日付を拾った誤取得だった。デジタル改革課のHTMLは14件中1件、デジタル基盤整備課のHTMLは8件中0件しか掲載日が取れない。**掲載日が取れないと期間フィルタが機能せず毎回全件が候補になるため、保持件数が少なくても掲載日が確実なRSSを選ぶ。**dc:subjectはどのRSSにも無いのでcategory_includesは使えない。個別案件URLは/329847.htmのようなページ番号で発行され、年度や回次で固定URLを上書き再利用する形ではない。**content_selectorに#ContentPaneを明示することが必須である。**とりネットはASP.NET WebFormsでbody直下がまるごとform id="Form1"になっており、抽出器のEXCLUDED_ELEMENTSにformが含まれるため、content_selectorを省略するとフォールバックのbodyが0文字になりcontent_extractが200文字判定で失敗する。RSS由来の記事8件（.htm形式とdd.aspx?menuid=形式の両方）で実測すると、未設定は全件失敗し#ContentPaneでは477文字から2,973文字を取得できた。#Middleや.BodyDefでも文字数は増えるがサイドバーや全庁ナビが混ざるため#ContentPaneを採る

  - id: chiba-city
    name: 千葉市
    organization_type: designated_city
    prefecture: 千葉県
    official_domain: city.chiba.jp
    enabled: true
    notes: 民間提案、スマートシティ実証、行政DX、情報システム、全庁の業務委託を調査対象とする政令指定都市。市公式CMSは一覧・個別ページとも本文が#contents_editableに入る。業務委託一覧は公開日を年なしの月日で表示し、同じtr内に和暦の募集期間も置くため、現行Collectorでは募集期間の日付をpublishedAtとして誤取得する。専用RSSは正しいdc:dateを持つが10件だけを保持する

  - id: saitama-city
    name: さいたま市
    organization_type: designated_city
    prefecture: 埼玉県
    official_domain: city.saitama.lg.jp
    enabled: true
    notes: 全庁のプロポーザルと業務委託入札、デジタル改革推進部の調達を収集する対象政令指定都市。**本文は#contentsに入り、フォールバック候補にも#contentsが含まれるため未設定でも動くが、全情報源で明示している。**個別ページには「更新日付：2026年8月13日 / ページ番号：C131659」の形式で更新日があり解釈できる。**一覧のテンプレートが2系統ある。**部の取扱い情報一覧は旧テンプレートで.ul_contents_list01のli配下にリンクが並び、プロポーザルと業務委託は新テンプレート（.l-container配下）でdiv.in_column_box内のh2.ttl_type1_linkにリンクが入るためliでは取れない。新着情報一覧はh2.ttl_type1に日付、div.item_box配下のdl.new_list01のddにリンクが入る**兄弟構造で、日付とリンクを関連付けられないため掲載日が0件になる。**新着情報はRSSも配信しており、RSSはdc:dateを全件に持つのでRSSを採る。個別案件URLは/005/001/017/012/p131659.htmlのようにページ番号で発行され、年度や回次で固定URLを上書き再利用する形ではない

  - id: shimane-prefecture
    name: 島根県
    organization_type: prefecture
    prefecture: 島根県
    official_domain: pref.shimane.lg.jp
    enabled: true
    notes: 全庁の入札情報と、デジタル戦略室・教育連携推進課の入札公告を収集する対象都道府県。**本文は#page-contentに入り、#honbunはお問い合わせ先まで含む外側の入れ物である。**一覧の構造は2系統で、全庁の入札情報トップはul.genre-newsのli、部局別の入札公告ページは#page-content配下のul.page_listのliにリンクが入る。**掲載日はどの一覧でもリンク行の中にあるが「（ 8月19日）」のように年を含まないため、parseDateCandidateがnullを返し掲載日を1件も取得できない。**山梨県のDX課新着と同じ表記で、個別ページにも掲載日のマークアップが無い。**したがって全候補が掲載日不明として毎回対象になり、initial_sinceは効かない。**対象外判定でもNotionページが作られ次回から重複でスキップされるので、全件分析は一度きりのコストである。**RSSは採らない。**bid_info/index.rdfが配信されているが、拡張子がrdfでも中身はRSS 2.0で、確認時点はitem 10件・pubDateもdc:dateも0件で日付を1件も持たない。HTML側は18件を保持するため、件数でも日付でもHTMLが優位である。個別案件URLは/bid_info/bid_kyouikurenkei/R8kyoudoutyoutatu.htmlのように所属ディレクトリ配下の案件別ファイル名で、令和7年度版と令和8年度版が別ファイル（shimanegigakyodo/R8kyoudoutyoutatu）として並存するため固定URLの上書き再利用ではない

  - id: shizuoka-city
    name: 静岡市
    organization_type: designated_city
    prefecture: 静岡県
    official_domain: city.shizuoka.lg.jp
    enabled: true
    notes: 全庁の事業者募集、事業者向け新着情報、スタートアップ共創の行政ニーズを収集する対象政令指定都市。静岡県（pref.shizuoka.jp）とは別ドメインなので別組織として登録する。**CMSは神戸市・山梨県と同じ#tmp_接頭辞系で、本文は#tmp_contentsに入る。#tmp_honbunは実測9文字で空**なので本文セレクタには使えない。個別ページのmainはナビゲーションまで含む5,500文字前後になり、**/startup/配下だけは旧テンプレートでmain要素そのものが無く0文字になる**ため、content_selectorは必ず#tmp_contentsを指定する。**掲載日の在り方が一覧ごとに違う。**事業者募集（p000358）は日付のマークアップが無く、新着情報一覧（p0000039）とお知らせ一覧（p0000038）はリンクと同じtrに日付があるが「8月7日」のように年を含まずparseDateCandidateがnullを返す。Startup Hubの新着だけが「2026年7月8日」形式で解釈できる。個別ページには「更新日 2026年8月7日」があるが、候補の期間フィルタは一覧側の掲載日で判定するため効かない。**個別案件URLは/s2547/s012632.htmlのような案件別ファイルで年度をまたぐ再利用ではないが、案件の進行に応じて同じURLの内容とタイトル接頭辞が募集→【質問に対する回答の公表】→【選定結果の公表】と書き換わる固定URL更新型である。**一覧側のタイトルは個別ページより遅れることがあり、確認時点では総務事務センター運営等業務が一覧で【質問に対する回答の公表】のまま、実ページは選定結果と契約予定者名まで掲載していた。様式がワード、別紙がエクセルの案件があり、PDF以外の添付は取得対象外である

