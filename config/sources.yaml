    official_domain: city.sapporo.jp
    enabled: true
    notes: 全庁の入札・契約と募集の行政ニーズを収集する対象自治体。SAPPORO CO-CREATION GATEのwww4.city.sapporo.jpはcity.sapporo.jpのサブドメインのため、別組織に分けず同一組織として管理する

  - id: fukushima-prefecture
    name: 福島県
    organization_type: prefecture
    prefecture: 福島県
    official_domain: pref.fukushima.lg.jp
    enabled: true
