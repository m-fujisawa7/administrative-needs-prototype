    notes: 愛知県と企業等が連携し、県庁内の各所属が抱える行政課題をデジタル技術で解決する実証事業の専用サイト。pref.aichi.jp配下のサブドメインなので外郭組織を作らずaichi-prefectureへ紐付けている。静的HTMLで本文が取得でき、トップページの可視テキストは1,972文字で、静岡県のCO-LAB Shizuokaのように本文がJavaScript実行後にしか現れない問題は無い。**各テーマに個別URL（projects/new_project01.htmlからnew_project06.html）があり、神戸UIKや富山Digi-PoCのようなjavascript:void(0)ではないのでlist_pageとして成立する。**a[href^="projects/"]で6件を取得できることを確認した。個別ページは可視テキスト5,029文字でPDFは無く、解決したい課題・想定する実証実験・実現したい未来・提案企業が得られるもの・ストーリーが節ごとに書かれた行政ニーズの資料として理想的な内容である（防災ビジネス情報提供システムの構築では、事業者から受けた技術情報を活用できていない課題と、WEB上のマッチングプラットフォーム構築および職員のエクセル入力業務の効率化検証が示されている）。**それでも無効にする理由は2つある。**第一に、**確認時点で6テーマすべてが受付終了で、募集期間は2026年5月11日から2026年6月8日までだった。**第二に、**URLに年度が入らずnew_project01.htmlの形式で、projects/project01.htmlもprojects/r6_project01.htmlも404、new_project07.htmlも404だった。前年度分が見つからないため翌年度に同じURLが上書きされる可能性が高く、その場合は公式URL単位の重複判定で新しいテーマが恒久的にスキップされる。**次回募集（例年5月頃）の開始時に、新テーマへ別URLが発行されるか既存URLが上書きされるかを人が確認してから有効化を判断する。福島県と新潟県のPPP/PFIと同じC型の扱いである。掲載中の6テーマを取得したい場合は、有効化ではなくnotion:batchで6URLを一度だけ登録する運用が適する。
