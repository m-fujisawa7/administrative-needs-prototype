    content_selector: "#mol_contents"
    document_type_hints:
      - RFI
      - プロポーザル
      - 業務委託
    notes: デジタル統括室の情報提供依頼、プロポーザル、業務委託などを集約する入札・契約情報一覧。発注予定や取止めも含むため、後続のAI判定で選別する。
    last_verified_at: "2026-08-07"
    verification_status: verified

  - id: osaka-dx-practice-list
    organization_id: osaka-city
