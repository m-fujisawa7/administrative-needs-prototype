    notes: プロポーザル・RFI、未来投資・デジタル産業課、デジタルトランスフォーメーション課、全庁RSSから行政DX・情報システム・実証・官民共創の行政ニーズを収集する対象都道府県。公式CMSの一覧はli内に年付きの更新日と案件リンクがあり、個別ページの本文は#main_bodyに入る。全庁HTMLは97ページあるが現行collectorはページャを追従しないため、100件を保持する公式RSSを補助Sourceに使う

