version: 1
name: 自社

# A判定: 自社単独で提供価値と直接合致する領域
direct_fit:
  - Webサイト・ポータル構築
  - CMS導入
  - UI・UX設計
  - 情報設計
  - コンテンツ制作・運用
  - Web運用内製化支援
  - 行政サービスのデジタル接点改善

# B判定: パートナーとの連携により関与できる領域
partner_fit:
  - 大規模システム開発を含む案件
  - SIerやコンサルティング会社との共同提案
  - 広告代理店や地域企業との共同提案
  - Web以外の業務改善を主要範囲に含む案件

# C判定: 直近の案件化可能性は低いが、将来に向けて継続確認したい領域・段階
strategic_interest:
  - Webサイト・CMS刷新の構想・調査・計画段階
  - 行政サービスのデジタル接点改善に関する中長期計画
  - デジタル人材育成・内製化方針の検討段階
  - 官民連携・実証事業の制度設計または構想段階

out_of_scope:
  - PCやプリンターなどの物品購入
  - ソフトウェアライセンスの単純更新
  - 回線調達やハードウェア保守のみ
  - 土木・建築・設備工事
  - 清掃・警備・人材派遣のみ

notes: この初期値は実装指示書の想定を記録したもの。実運用前に自社の提供領域、将来注力領域、パートナー方針に合わせて更新する。
